name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eisa-h-zd-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify ordered sedenion zero-divisor contract
        run: bash scripts/gate_zd_pair_contract.sh

  eisa-h-zd-rtl-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Validate RTL encoding without exhaustive simulation
        run: |
          python3 tools/eisa_h/check_basis_rom.py .
          iverilog -g2012 -Wall -tnull -s eisa_h_sed16_zd_pair_v1 rtl/eisa_h_sed16_zd_pair_v1.sv

  eisa-h-zd-synthesis-contract:
    needs: [eisa-h-zd-contract, eisa-h-zd-rtl-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install dispatch packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends iverilog yosys
      - name: Validate synthesis dispatch surface
        run: |
          bash -n scripts/gate_zd_pair_synth.sh
          bash -n scripts/gate_zd_pair_formal.sh
          bash -n scripts/gate_zd_pair_formal_surface.sh
          bash -n scripts/slurm/run_zd_pair_synth.sh
          bash -n scripts/slurm/run_zd_pair_formal.sh
          bash -n scripts/ci/slurm_launcher_contract_test.sh
          bash -n scripts/ci/postsynth_log_contract_test.sh
          python3 -m py_compile tools/eisa_h/check_basis_rom.py tools/eisa_h/normalize_iverilog_log.py tools/eisa_h/validate_synth_receipt.py tools/eisa_h/validate_postsynth_receipt.py tools/eisa_h/validate_formal_receipt.py tools/eisa_h/validate_slurm_result.py
          python3 tools/eisa_h/check_basis_rom.py .
          python3 tools/eisa_h/validate_postsynth_receipt.py . --contract-only --simulator-version 12.0
          python3 tools/eisa_h/validate_formal_receipt.py . --contract-only
          if python3 tools/eisa_h/validate_postsynth_receipt.py . --contract-only --simulator-version 11.0; then
            echo "post-synthesis simulator-version mutation unexpectedly passed" >&2
            exit 1
          fi
          bash scripts/ci/postsynth_log_contract_test.sh
          bash scripts/ci/slurm_launcher_contract_test.sh

  eisa-h-zd-formal-partition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install formal surface tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends yosys
      - name: Validate exact state-step partition geometry
        run: |
          bash -n scripts/gate_zd_pair_formal_partition_emit.sh
          bash -n scripts/gate_zd_pair_formal_partition_surface.sh
          bash -n scripts/slurm/run_zd_pair_formal_partition_emit.sh
          python3 -m py_compile tools/eisa_h/generate_state_partition_recipes.py tools/eisa_h/validate_formal_receipt.py
          python3 tools/eisa_h/validate_formal_receipt.py . --contract-only
          bash scripts/gate_zd_pair_formal_partition_surface.sh
